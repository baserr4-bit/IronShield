name: Build IronShield APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v3
      with:
        gradle-version: 8.2

    - name: Build Debug APK
      run: gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: IronShield-debug
        path: app/build/outputs/apk/debug/app-debug.apk
'نسخه پشتیبان را در فضای ابری مثل Google Drive یا پیام‌های ذخیره‌شدهٔ ایتا و تلگرام ذخیره کنید.|احفظ النسخة الاحتياطية في السحابة مثل Google Drive أو في الرسائل المحفوظة في إيتا وتلغرام.|بیک اپ کو Google Drive جیسے کلاؤڈ یا ایتا اور ٹیلیگرام کے محفوظ پیغامات میں رکھیں۔|Save the backup to the cloud such as Google Drive, or to Eitaa and Telegram saved messages.|将备份保存到 Google Drive 等云端，或 Eitaa 和 Telegram 的“已保存消息”。',
'در منوی باز شده، Google Drive یا برنامهٔ دلخواه را انتخاب کنید. برای بازیابی، در «بازیابی اطلاعات از فایل پشتیبان» همان فایل را انتخاب کنید.|في القائمة المفتوحة اختر Google Drive أو أي تطبيق تريده. وللاستعادة اختر الملف نفسه في «استعادة البيانات من ملف النسخ الاحتياطي».|کھلنے والے مینو میں Google Drive یا اپنی پسند کی ایپ منتخب کریں۔ بحالی کے لیے «بیک اپ فائل سے ڈیٹا بحال کریں» میں وہی فائل منتخب کریں۔|In the menu that opens, choose Google Drive or any app you like. To restore, pick the same file in "Restore data from backup file".|在弹出的菜单中选择 Google Drive 或任意应用。恢复时，请在“从备份文件恢复数据”中选择同一文件。',
'اطلاعات فعلی با این نسخه جایگزین می‌شود. پیش از آن یک نسخه پشتیبان از وضعیت فعلی ساخته می‌شود.|ستُستبدل البيانات الحالية بهذه النسخة. قبل ذلك تُنشأ نسخة احتياطية من الحالة الحالية.|موجودہ ڈیٹا اس نسخے سے بدل دیا جائے گا۔ اس سے پہلے موجودہ حالت کا بیک اپ بنایا جائے گا۔|Current data will be replaced with this copy. A backup of the current state is made first.|当前数据将被此备份替换。替换前会先为当前状态创建一份备份。',
'نسخه جدید نرم‌افزار آمده است|صدر إصدار جديد من التطبيق|ایپ کا نیا ورژن آ گیا ہے|A new version of the app is available|应用有新版本',
'بعداً|لاحقاً|بعد میں|Later|稍后',
'تصویر فاکتور در گالری گوشی ذخیره شد|حُفظت صورة الفاتورة في معرض الهاتف|انوائس کی تصویر فون کی گیلری میں محفوظ ہو گئی|Invoice image saved to your phone gallery|发票图片已保存到手机相册',
'ذخیره تصویر ناموفق بود|فشل حفظ الصورة|تصویر محفوظ کرنا ناکام رہا|Saving the image failed|保存图片失败',
'مبلغ باقیمانده طلب خریدار از فروشنده|الرصيد المتبقي من مستحقات المشتري لدى البائع|خریدار کا بیچنے والے کے ذمے باقی بقایا|Remaining credit of the buyer from the seller|买家对卖家的剩余应收款',
'باقیمانده طلب|المتبقي من المستحقات|باقی بقایا|Remaining credit|剩余应收款',
'نسخه|الإصدار|ورژن|Version|版本',
'کیلوگرم|كيلوغرام|کلوگرام|kg|公斤',
'گرم|غرام|گرام|g|克',
'لیتر|لتر|لیٹر|L|升',
'عدد|حبة|عدد|pcs|个'
];
const TX={};TXR.forEach(r=>{const a=r.split('|');TX[a[0]]={ar:a[1],ur:a[2],en:a[3],zh:a[4]}});
const KEYS=Object.keys(TX).sort((a,b)=>b.length-a.length);
const isL=c=>!!c&&/[\u0600-\u065F\u066E-\u06EF\u06FA-\u06FF]/.test(c);
function rw(s,k,v){let o='',i=0,j;while((j=s.indexOf(k,i))>=0){const e=j+k.length;if(isL(s[j-1])||isL(s[e])){o+=s.slice(i,j+1);i=j+1}else{o+=s.slice(i,j)+v;i=e}}return o+s.slice(i)}
function tr(s){const l=LG();s=String(s);if(l=='fa'||!/[\u0600-\u06FF]/.test(s))return s;for(const k of KEYS)if(s.includes(k))s=rw(s,k,TX[k][l]);return s}
function applyLang(root){if(LG()=='fa'||!root)return;if(root.nodeType==3){const r=tr(root.nodeValue);if(r!==root.nodeValue)root.nodeValue=r;return}
const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>(/^(SCRIPT|STYLE)$/.test(n.parentNode.nodeName)||(n.parentNode.closest&&n.parentNode.closest('[data-nt]')))?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});const ns=[];while(w.nextNode())ns.push(w.currentNode);ns.forEach(n=>{const r=tr(n.nodeValue);if(r!==n.nodeValue)n.nodeValue=r});
const els=[root,...(root.querySelectorAll?root.querySelectorAll('[placeholder],[title]'):[])];els.forEach(e=>{['placeholder','title'].forEach(a=>{const v=e.getAttribute&&e.getAttribute(a);if(v){const r=tr(v);if(r!==v)e.setAttribute(a,r)}})})}
new MutationObserver(ms=>{if(LG()=='fa')return;ms.forEach(m=>m.addedNodes.forEach(n=>applyLang(n)))}).observe(document.body,{childList:true,subtree:true});
function applyDir(){const l=LG(),h=document.documentElement;h.lang=l;h.dir=['fa','ar','ur'].includes(l)?'rtl':'ltr'}
function setLang(l){S.lang=l;save();applyDir();closeTpl();render()}

/* ===== پنجرهٔ پیش‌نمایش قالب (اندازهٔ گوشی، بدون اسکرول، قابل بستن) ===== */
function pickTpl(n){S.tpl=n;save();closeTpl();render()}
function tplPrev(n){closeTpl();
const d=D.items.length?D:{cust:'مشتری نمونه',items:S.p.slice(0,3).map(p=>({name:p.name,unit:p.unit,qty:p.unit=='گرم'?100:1,price:p.price})),disc:0,acct:'-'};
const m=document.createElement('div');m.id='tplm';
m.style.cssText='position:fixed;inset:0;background:#000d;z-index:98;display:flex;flex-direction:column;align-items:center;padding:10px;padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));overflow:hidden';
m.innerHTML='<div class="row" style="width:100%;max-width:520px;flex:0 0 auto;margin-bottom:8px"><button onclick="pickTpl('+n+')">انتخاب این قالب</button><button class="s" onclick="closeTpl()">✕ بستن</button></div><div id="tpw" style="flex:1;min-height:0;width:100%;display:flex;justify-content:center;align-items:flex-start;overflow:hidden"><div id="tpi" style="flex:0 0 auto;width:700px;transform-origin:top center">'+sheet(d,n)+'</div></div>';
document.body.appendChild(m);fitTpl();setTimeout(fitTpl,80);setTimeout(fitTpl,500)}
function fitTpl(){const w=$('#tpw'),i=$('#tpi');if(!w||!i)return;i.style.transform='none';const k=Math.min(w.clientWidth/i.offsetWidth,w.clientHeight/i.offsetHeight,1);i.style.transform='scale('+k+')'}
function closeTpl(){const m=$('#tplm');if(m)m.remove()}
addEventListener('resize',fitTpl);

function pickSrc(){const a=document.createElement('div');a.id='askb';a.style.cssText='position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;z-index:99;padding:20px';a.innerHTML='<div class=card style="max-width:340px;width:100%;margin:0"><p><b>انتخاب عکس فاکتور</b></p><div class=row><label style="display:block;text-align:center;padding:12px;border-radius:10px;background:var(--pri);color:#fff;font-weight:700;font-size:15px;margin:0;position:relative;cursor:pointer">🖼️ گالری<input type=file accept="image/*" style="position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0" onchange="readImg(this)"></label><label style="display:block;text-align:center;padding:12px;border-radius:10px;background:var(--pri);color:#fff;font-weight:700;font-size:15px;margin:0;position:relative;cursor:pointer">📷 دوربین<input type=file accept="image/*" capture=environment style="position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0" onchange="readImg(this)"></label></div><button class=s id=px style="width:100%;margin-top:8px">انصراف</button></div>';document.body.appendChild(a);a.querySelector('#px').onclick=()=>a.remove()}
let UPOK=false;try{UPOK=!!sessionStorage.getItem('upd');sessionStorage.removeItem('upd')}catch(e){}
function updUI(){return `<div class="row" style="align-items:center"><button class="s fit" onclick="doUpdate()">🔄 به‌روزرسانی</button><span style="font-weight:700">${UPOK?'<span style="color:var(--grn)">✅ نرم‌افزار بروز است</span> · ':''}<span style="color:var(--mut)">نسخه ${F(VER)}</span></span></div>`}
async function doUpdate(){toast('در حال بررسی...');let nv=VER;
try{const r=await fetch(location.pathname+'?_='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;const m=(await r.text()).match(/const VER='([^']+)'/);if(m)nv=m[1]}catch(e){return toast('اتصال اینترنت برقرار نیست')}
if(nv!=VER){toast('نسخه جدید پیدا شد؛ در حال به‌روزرسانی...');try{if(window.caches)for(const k of await caches.keys())await caches.delete(k);if(navigator.serviceWorker)for(const g of await navigator.serviceWorker.getRegistrations())await g.unregister();sessionStorage.setItem('upd','1');await fetch(location.pathname,{cache:'reload'})}catch(e){}location.reload();return}
UPOK=true;render()}

/* ===== پشتیبان‌گیری و بازیابی ===== */
const BKEY='smart-invoice-backups-v1';let BK='make';
const bkAll=()=>{try{return JSON.parse(localStorage.getItem(BKEY))||[]}catch(e){return[]}};
function bkSaveAll(a){while(true){try{localStorage.setItem(BKEY,JSON.stringify(a));return true}catch(e){if(a.length<=1)return false;a.shift()}}}
function cyr(s){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return 'c'+(4294967296*(2097151&h2)+(h1>>>0)).toString(16)}
const hasSub=()=>!!(window.crypto&&crypto.subtle);
async function shaOf(s){try{if(hasSub()){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return 's'+[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}}catch(e){}return cyr(s)}
async function shaCheck(s,h){if(!h)return false;if(h[0]=='c')return cyr(s)===h;if(!hasSub())return true;return (await shaOf(s))===h}
async function buildBackup(){const data=JSON.parse(JSON.stringify(S));if(data.shop)delete data.shop.apiKey;const payload=JSON.stringify(data);const sha=await shaOf(payload);
return JSON.stringify({app:'smart-invoice-maker',format:1,version:VER,created:new Date().toISOString(),counts:{products:S.p.length,customers:S.c.length,invoices:S.inv.length},sha256:sha,payload})}
const bkName=()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');return 'invoice-backup-'+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes())+'.backup'};
function addBk(str,type){const a=bkAll();a.push({id:uid(),t:Date.now(),type,size:new Blob([str]).size,txt:str});return bkSaveAll(a.slice(-10))}
const fmtDate=t=>F(new Date(t).toLocaleString(LG()=='fa'?'fa-IR-u-nu-latn':'en-GB',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}));
const fmtSize=b=>F((b/1024).toFixed(1))+' KB';
function bkDl(str,name){const na=NA();if(na){b64Of(new Blob([str])).then(b=>na.saveFile(b,name,'application/octet-stream'));return}const f=new File([str],name,{type:'application/octet-stream'}),u=URL.createObjectURL(f),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000)}
async function bkMake(mode){try{const str=await buildBackup(),name=bkName();addBk(str,'manual');S.lastBk=Date.now();save();
if(mode=='share'){const na=NA();if(na){na.shareFile(await b64Of(new Blob([str])),name,'application/octet-stream','');render();return}const f=new File([str],name,{type:'text/plain'});if(navigator.share&&navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:name});render();return}catch(e){if(e&&e.name=='AbortError'){render();return}}}
bkDl(str,name);toast('منوی اشتراک پشتیبانی نشد؛ فایل در پوشه Downloads ذخیره شد')}else{bkDl(str,name);toast('نسخه پشتیبان در پوشه Downloads ذخیره شد')}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}render()}catch(e){toast('تهیه نسخه پشتیبان ناموفق بود')}}
async function bkVerify(text){let o;try{o=JSON.parse(text)}catch(e){return{err:'فایل پشتیبان معتبر نیست'}}
if(!o||o.app!=='smart-invoice-maker'||typeof o.payload!=='string')return{err:'این فایل، پشتیبان این نرم‌افزار نیست'};
if(!(await shaCheck(o.payload,o.sha256)))return{err:'فایل پشتیبان خراب یا ناقص است'};
let d;try{d=JSON.parse(o.payload)}catch(e){return{err:'فایل پشتیبان خراب یا ناقص است'}}
if(!d||!Array.isArray(d.p)||!Array.isArray(d.c)||!Array.isArray(d.inv)||!d.shop||typeof d.shop!=='object'||!d.p.every(x=>x&&typeof x.name=='string')||!d.inv.every(x=>x&&Array.isArray(x.items)))return{err:'ساختار فایل پشتیبان درست نیست'};
return{ok:true,o,d}}
async function bkPick(inp){const f=inp.files&&inp.files[0];inp.value='';if(!f)return;if(f.size>2e7)return toast('فایل بیش از حد بزرگ است');let t='';try{t=await f.text()}catch(e){return toast('خواندن فایل ناموفق بود')}bkConfirm(t)}
async function bkConfirm(text){const r=await bkVerify(text);if(!r.ok)return toast(r.err);
const a=document.createElement('div');a.id='askb';a.style.cssText='position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:99;padding:20px';
a.innerHTML=`<div class=card style="max-width:360px;width:100%;margin:0"><p><b>بازیابی اطلاعات</b></p><p>تاریخ پشتیبان: ${fmtDate(Date.parse(r.o.created)||Date.now())}<br>کالاها: ${F(r.d.p.length)} · مشتریان: ${F(r.d.c.length)} · فاکتورها: ${F(r.d.inv.length)}</p><p style="color:var(--mut);font-size:13px">اطلاعات فعلی با این نسخه جایگزین می‌شود. پیش از آن یک نسخه پشتیبان از وضعیت فعلی ساخته می‌شود.</p><div class=row><button id=ok>بازیابی</button><button class=s id=no>انصراف</button></div></div>`;
document.body.appendChild(a);a.querySelector('#no').onclick=()=>a.remove();a.querySelector('#ok').onclick=()=>{a.remove();bkApply(r.d)}}
async function bkApply(d){const old=localStorage.getItem(KEY);
try{addBk(await buildBackup(),'pre');const n=JSON.parse(JSON.stringify(d));n.shop=Object.assign({},n.shop);n.shop.apiKey=(S.shop&&S.shop.apiKey)||'';n.lang=S.lang;
n.p.sort(srt);if(Array.isArray(n.c))n.c.sort(srt);if(typeof n.no!='number')n.no=1001;if(!n.tpl)n.tpl=1;
const js=JSON.stringify(n);localStorage.setItem(KEY,js);if(localStorage.getItem(KEY)!==js)throw 0;
S=n;D={cid:'',cust:'',items:[],disc:0,pm:'نقدی',debt:0,note:'',ctel:'',caddr:''};AE=null;CE=null;PE=null;PQ='';CQ='';tab='set';render();toast('اطلاعات با موفقیت بازیابی شد')}
catch(e){try{if(old!==null)localStorage.setItem(KEY,old)}catch(_){}toast('بازیابی ناموفق بود؛ اطلاعات قبلی دست‌نخورده ماند')}}
const BKT={manual:'نسخه دستی',auto:'نسخه خودکار',pre:'قبل از بازیابی'};
async function bkList(){const el=document.getElementById('bkm');if(!el)return;const a=bkAll().slice().reverse();
if(!a.length){el.innerHTML='<p>هنوز نسخه پشتیبانی ساخته نشده.</p>';return}
const rows=[];for(const x of a){const r=await bkVerify(x.txt);rows.push(`<div class="li"><div>${fmtDate(x.t)}<small>${fmtSize(x.size)} · ${BKT[x.type]||x.type} · <b style="color:${r.ok?'var(--grn)':'#b3402e'}">${r.ok?'✔ سالم':'✖ خراب'}</b></small></div><div class="row fit" style="flex-wrap:wrap">${r.ok?`<button class="s" onclick="bkRestoreId('${x.id}')">بازیابی</button><button class="s" onclick="bkSaveId('${x.id}')">ذخیره فایل</button>`:''}<button class="d" onclick="bkDelId('${x.id}')">حذف</button></div></div>`)}
el.innerHTML=rows.join('')}
const bkGet=id=>bkAll().find(x=>x.id==id);
function bkRestoreId(id){const x=bkGet(id);if(x)bkConfirm(x.txt)}
function bkSaveId(id){const x=bkGet(id);if(x){bkDl(x.txt,bkName());toast('نسخه پشتیبان در پوشه Downloads ذخیره شد')}}
function bkDelId(id){ask('این نسخه پشتیبان حذف شود؟',()=>{bkSaveAll(bkAll().filter(x=>x.id!=id));bkList()})}
function autoCheck(){const m=S.auto||'off';if(m=='off')return;const iv={daily:864e5,weekly:6048e5,monthly:2592e6}[m];if(Date.now()-(S.autoLast||0)<iv)return;
buildBackup().then(str=>{if(addBk(str,'auto')){S.autoLast=Date.now();save();if(tab=='set')render()}})}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState=='visible'){autoCheck();checkUpdate(false)}});
function bkPanel(){const P='style="color:var(--mut);font-size:13px"';
if(BK=='make')return `<p>همه اطلاعات برنامه (صاحب حساب، مشتریان، کالاها، فاکتورها و جزئیات اقلام، تنظیمات) در یک فایل با پسوند backup ذخیره می‌شود.</p><div class="row"><button onclick="bkMake('dl')">💾 ذخیره در گوشی</button><button class="s" onclick="bkMake('share')">📂 انتخاب محل ذخیره</button></div><p ${P}>آخرین پشتیبان: ${S.lastBk?fmtDate(S.lastBk):'—'}</p><p ${P}>کلید API به دلایل امنیتی در فایل پشتیبان ذخیره نمی‌شود.</p>`;
if(BK=='restore')return `<label class="up" style="position:relative;cursor:pointer">📥 انتخاب فایل پشتیبان<input type="file" accept="*/*" style="position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0" onchange="bkPick(this)"></label><p ${P}>فایل پیش از بازیابی بررسی می‌شود. اگر خراب باشد یا بازیابی ناموفق شود، اطلاعات فعلی دست‌نخورده می‌ماند.</p>`;
if(BK=='manage')return `<div id="bkm"></div><p ${P}>۱۰ نسخهٔ آخر در همین برنامه نگه‌داری می‌شود. اگر داده‌های مرورگر پاک شود این نسخه‌ها هم پاک می‌شوند؛ برای امنیت، فایل پشتیبان را بیرون از برنامه هم ذخیره کنید.</p>`;
if(BK=='auto'){const o=[['off','خاموش'],['daily','روزانه'],['weekly','هفتگی'],['monthly','ماهانه']];return `<label>زمان‌بندی پشتیبان‌گیری خودکار</label><select onchange="S.auto=this.value;save();autoCheck();render()">${o.map(x=>`<option value="${x[0]}" ${(S.auto||'off')==x[0]?'selected':''}>${x[1]}</option>`).join('')}</select><p ${P}>آخرین پشتیبان خودکار: ${S.autoLast?fmtDate(S.autoLast):'—'}</p><p ${P}>پشتیبان خودکار هنگام باز کردن برنامه ساخته می‌شود و در «مدیریت نسخه‌های پشتیبان» نگه‌داری می‌شود.</p>`}
return `<p>نسخه پشتیبان را در فضای ابری مثل Google Drive یا پیام‌های ذخیره‌شدهٔ ایتا و تلگرام ذخیره کنید.</p><button style="width:100%" onclick="bkMake('share')">☁️ ذخیره در فضای ابری</button><p ${P}>در منوی باز شده، Google Drive یا برنامهٔ دلخواه را انتخاب کنید. برای بازیابی، در «بازیابی اطلاعات از فایل پشتیبان» همان فایل را انتخاب کنید.</p>`}
function bkUI(){const T=[['make','تهیه نسخه پشتیبان کامل'],['restore','بازیابی اطلاعات از فایل پشتیبان'],['manage','مدیریت نسخه‌های پشتیبان'],['auto','تنظیمات پشتیبان‌گیری خودکار'],['cloud','پشتیبان‌گیری ابری']];
return `<b>پشتیبان‌گیری و بازیابی اطلاعات</b><div class="bks" style="display:flex;flex-wrap:wrap;gap:6px;margin:10px 0">${T.map(x=>`<button class="s ${BK==x[0]?'on':''}" style="flex:1 1 45%;font-size:13px;padding:9px 6px" onclick="BK='${x[0]}';render()">${x[1]}</button>`).join('')}</div><div id="bkp">${bkPanel()}</div>`}

/* ===== اعلان نسخهٔ جدید هنگام باز کردن برنامه ===== */
const vnum=v=>String(v).split('.').map(x=>parseInt(x)||0);
const vgt=(a,b)=>{const x=vnum(a),y=vnum(b);for(let i=0;i<3;i++){if((x[i]||0)!==(y[i]||0))return(x[i]||0)>(y[i]||0)}return false};
let UCHK=0;
async function checkUpdate(force){if(navigator.onLine===false)return;if(!force&&Date.now()-UCHK<6e5)return;UCHK=Date.now();
try{const r=await fetch(location.pathname+'?_='+Date.now(),{cache:'no-store'});if(!r.ok)return;const m=(await r.text()).match(/const VER='([^']+)'/);if(!m)return;const nv=m[1];if(!vgt(nv,VER))return;
let dis='';try{dis=sessionStorage.getItem('updDis')}catch(e){}if(dis===nv)return;showUpd(nv)}catch(e){}}
function showUpd(nv){if(document.getElementById('updbar'))return;const a=document.createElement('div');a.id='updbar';
a.style.cssText='position:fixed;top:calc(8px + env(safe-area-inset-top,0px));inset-inline:10px;z-index:97;max-width:520px;margin:auto;background:#2e6b3a;color:#fff;border-radius:14px;padding:10px 12px;box-shadow:0 6px 20px #0005';
a.innerHTML=`<div style="font-weight:700;margin-bottom:8px">🔔 نسخه جدید نرم‌افزار آمده است (${F(nv)})</div><div class="row"><button id="uy" style="background:#fff;color:#1b5e20">به‌روزرسانی</button><button id="un" style="background:#ffffff33;color:#fff">بعداً</button></div>`;
document.body.appendChild(a);a.querySelector('#uy').onclick=()=>{a.remove();doUpdate()};a.querySelector('#un').onclick=()=>{a.remove();try{sessionStorage.setItem('updDis',nv)}catch(e){}}}

const tabs=[['set','تنظیمات'],['new','فاکتور جدید'],['inv','فاکتورها'],['prod','کالاها'],['cust','مشتریان'],['acc','صاحب حساب']];
const UN=[['کیلوگرم','کیلوگرم'],['گرم','گرم'],['مثقال','مثقال'],['عدد','تعداد'],['لیتر','لیتر'],['واحد','واحد']];
const MG=4.68; /* وزن یک مثقال به گرم — در صورت نیاز اینجا تغییر دهید (مثلا 4.608) */
const TOG={'گرم':1,'کیلوگرم':1000,'مثقال':MG};
const comp=(a,b)=>a==b||!!(TOG[a]&&TOG[b]);
const sizeOf=(su,bu)=>su==bu?1:(TOG[su]&&TOG[bu]?TOG[su]/TOG[bu]:1);
const toPU=(i,p)=>{if(i.unit==p.unit)return i.qty;const a=TOG[i.unit],b=TOG[p.unit];return a&&b?i.qty*a/b:i.qty};
function ensureBase(i){if(i.bu===undefined){i.bu=i.unit;i.bp=i.price}}
function recalc(i){i.price=Math.round((+i.bp||0)*sizeOf(i.unit,i.bu)*1e4)/1e4}
const SHORT={'کیلوگرم':'کیلو','گرم':'گرم','مثقال':'مثقال','عدد':'عدد','لیتر':'لیتر','واحد':'واحد'};
const ppl=u=>'قیمت هر '+(SHORT[u]||u);
const lineT=i=>Math.round((+i.qty||0)*(+i.price||0)*100)/100;
const r2=x=>Math.round(x*100)/100;
function calc(d){const t=tot(d),cr=+d.credit||0;
if(cr>0){const sub=t.sub;return cr>sub?{sub,cr,disc:0,debt:0,mode:'cr',amount:r2(cr-sub)}:{sub,cr,disc:0,debt:0,mode:'pay',amount:r2(sub-cr)}}
const debt=+d.debt||0;return{sub:t.sub,cr:0,disc:t.disc,debt,mode:'pay',amount:r2(t.pay+debt)}}
const CRD={fa:['خریدار','فروشنده'],ar:['المشتري','البائع'],ur:['خریدار','بیچنے والا'],en:['buyer','seller'],zh:['买家','卖家']};
const CRL={ar:'الرصيد السابق للمشتري {b} لدى البائع {s}',ur:'خریدار {b} کا بیچنے والے {s} کے ذمے سابقہ بقایا',en:'Previous credit of {b} from {s}',zh:'{b} 对 {s} 的前期应收款'};
function credLbl(b,sl){const l=LG(),d=CRD[l]||CRD.fa;b=String(b||'').trim()||d[0];sl=String(sl||'').trim()||d[1];return l=='fa'?'طلب قبلی '+b+' از '+sl:CRL[l].replace('{b}',b).replace('{s}',sl)}
function listAmt(v){const c=calc(v);return c.mode=='cr'?'باقیمانده طلب: '+M(c.amount)+' تومان':M(c.amount)+' تومان'}
const wdt=n=>{n=+n;if(LG()!='fa'||!(n>0))return'';const r=Math.round(n);if(!r)return'';return (Math.abs(n-r)>0.005?'حدود ':'')+words(r)+' تومان'};
function wdSet(id,n){const e=document.getElementById(id);if(e)e.textContent=wdt(n)}
function setQ(k,v){const i=D.items[k];i.qty=+v;const f=$('#fp'+k);if(f)f.value=M(lineT(i));wdSet('wf'+k,lineT(i));upd()}
function setP(k,v){const i=D.items[k];i.price=+v;const z=sizeOf(i.unit,i.bu);i.bp=z?i.price/z:i.price;const f=$('#fp'+k);if(f)f.value=M(lineT(i));wdSet('wp'+k,i.price);wdSet('wf'+k,lineT(i));upd()}
function setU(k,u){const i=D.items[k];i.unit=u;recalc(i);render()}
function rows(){D.items.forEach(ensureBase);return D.items.map((i,k)=>`<div class="it"><b>${esc(i.name)}</b><div class="row"><div style="flex:1.8"><label>مقدار</label><div class="row" style="gap:4px"><input type="number" step="any" inputmode="decimal" value="${i.qty}" oninput="setQ(${k},this.value)"><select style="flex:0 0 auto;width:auto;padding:10px 6px" onchange="setU(${k},this.value)">${(UN.some(u=>u[0]==i.unit)?UN:[...UN,[i.unit,i.unit]]).map(u=>`<option value="${u[0]}" ${u[0]==i.unit?'selected':''}>${u[1]}</option>`).join('')}</select></div></div><button class="d fit" onclick="D.items.splice(${k},1);render()">حذف</button></div><div class="row"><div><label>${ppl(i.unit)}</label><div class="ib"><input type="number" inputmode="decimal" step="any" value="${i.price}" oninput="setP(${k},this.value)"><span class="sfx">تومان</span></div><small class="wd" id="wp${k}">${wdt(i.price)}</small></div><div><label>قیمت نهایی</label><div class="ib"><input readonly id="fp${k}" value="${M(lineT(i))}" style="font-weight:700"><span class="sfx">تومان</span></div><small class="wd" id="wf${k}">${wdt(lineT(i))}</small></div></div>${comp(i.bu,i.unit)?'':'<small style="color:#b3402e;display:block;margin-top:4px">تبدیل بین این دو واحد ممکن نیست؛ قیمت بدون تغییر محاسبه شد</small>'}</div>`).join('')}
function upd(){const c=calc(D),L=document.getElementById('crl');if(L)L.textContent=credLbl(D.cust,S.shop.seller);
['in_disc','in_debt'].forEach(id=>{const e=document.getElementById(id);if(e)e.disabled=c.cr>0});
wdSet('wdisc',D.disc);wdSet('wdebt',D.debt);wdSet('wcr',D.credit);
$('#sum').innerHTML=`<div class="sum"><span>جمع کل</span><span>${M(c.sub)}</span></div>${c.cr>0?`<div class="sum" style="color:#c62828;font-weight:800"><span data-nt="1">${esc(credLbl(D.cust,S.shop.seller))}</span><span>${M(c.cr)}</span></div>`:''}<div class="sum big"><span>${c.mode=='cr'?'مبلغ باقیمانده طلب خریدار از فروشنده':'قابل پرداخت'}</span><span>${M(c.amount)} تومان</span></div><small>${LG()=='fa'&&c.amount>0?words(c.amount)+' تومان':''}</small>`}
function hl(t,q){t=String(t);const n=nrm(t),k=nrm(q).trim();if(!k)return esc(t);let o='',i=0,j;while((j=n.indexOf(k,i))>=0){o+=esc(t.slice(i,j))+'<mark style="background:#ffd54f;color:#000;border-radius:3px;padding:0 1px">'+esc(t.slice(j,j+k.length))+'</mark>';i=j+k.length}return o+esc(t.slice(i))}
function pListHTML(){const q=nrm(PQ).trim(),L=S.p.filter(p=>!q||nrm(p.name).includes(q)).sort(srt);return L.map(p=>`<div class="li"><div>${hl(p.name,PQ)} ${p.stock<=p.min?'<span class="tag">رو به اتمام</span>':''}<small>${esc(p.cat)} · ${M(p.price)} تومان / ${esc(p.unit)} · موجودی ${M(p.stock)}</small></div><div class="row fit"><button class="s" onclick="PE=S.p.find(x=>x.id=='${p.id}');render();scrollTo(0,0)">ویرایش</button><button class="d" onclick="ask('این کالا حذف شود؟',()=>{S.p=S.p.filter(x=>x.id!='${p.id}');save();render()})">حذف</button></div></div>`).join('')||(S.p.length?'<p>موردی پیدا نشد.</p>':'<p>هنوز کالایی ثبت نشده.</p>')}
function cListHTML(){const q=nrm(CQ).trim(),L=S.c.filter(c=>!q||nrm(c.name).includes(q)).sort(srt);return L.map(c=>{return`<div class="li"><div>${hl(c.name,CQ)}<small>${esc(c.tel)}${c.addr?' · '+esc(c.addr):''}</small></div><div class="row fit"><button class="s" onclick="CE='${c.id}';render();scrollTo(0,0)">ویرایش</button><button class="d" onclick="S.c=S.c.filter(x=>x.id!='${c.id}');save();render()">حذف</button></div></div>`}).join('')||(S.c.length?'<p>موردی پیدا نشد.</p>':'<p>هنوز مشتری ثبت نشده.</p>')}
const V={
new(){return`<div class="card"><label>خریدار</label><select onchange="pickC(this.value)"><option value="">مشتری متفرقه</option>${S.c.map(c=>`<option value="${c.id}" ${D.cid==c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select><input style="margin-top:8px" placeholder="یا نام خریدار را بنویسید" value="${esc(D.cust)}" oninput="D.cust=this.value;D.cid='';upd()"><div class="g"><div><label>همراه</label><input inputmode="tel" value="${esc(D.ctel||'')}" oninput="D.ctel=this.value"></div><div><label>نشانی</label><input value="${esc(D.caddr||'')}" oninput="D.caddr=this.value"></div></div>
<label>روش افزودن کالا را انتخاب کن:</label><div class="up" onclick="pickSrc()">${F(1)}- 📷 انتخاب عکس فاکتور (خواندن خودکار)</div><details style="margin:6px 0 10px"><summary style="cursor:pointer;color:var(--pri);font-weight:600">${F(2)}- وارد کردن اقلام از کد (برای وقتی گالری باز نمیشود)</summary><textarea id="imp" placeholder="کد اقلام را اینجا Paste کنید" style="width:100%;height:90px;margin:6px 0;font:inherit;direction:ltr;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);padding:8px"></textarea><button class="s" onclick="importTxt()" style="width:100%">افزودن اقلام به فاکتور</button></details><select onchange="addI(this.value);this.value=''"><option value="">${F(3)}- انتخاب کالا…</option>${S.p.map(p=>`<option value="${p.id}">${esc(p.name)} — موجودی ${M(p.stock)} ${esc(p.unit)}</option>`).join('')}</select>
<div id="rows">${rows()}</div><label id="crl" data-nt="1" style="color:#c62828;font-weight:700">${esc(credLbl(D.cust,S.shop.seller))}</label><input id="in_cr" type="number" inputmode="numeric" value="${D.credit||''}" oninput="D.credit=+this.value;upd()"><small class="wd" id="wcr"></small><label>بدهی قبلی (تومان)</label><input id="in_debt" ${+D.credit>0?'disabled':''} type="number" inputmode="numeric" value="${D.debt||''}" oninput="D.debt=+this.value;upd()"><small class="wd" id="wdebt"></small><label>توضیحات</label><input value="${esc(D.note||'')}" oninput="D.note=this.value;upd()"><div class="g"><div><label>تخفیف (تومان)</label><input id="in_disc" ${+D.credit>0?'disabled':''} type="number" inputmode="numeric" value="${D.disc||''}" oninput="D.disc=+this.value;upd()"><small class="wd" id="wdisc"></small></div><div><label>نحوه پرداخت</label><select onchange="D.pm=this.value">${['نقدی','کارت','نسیه'].map(x=>`<option value="${x}" ${D.pm==x?'selected':''}>${x}</option>`).join('')}</select></div></div></div>
<div class="card"><label>حساب پرداخت روی فاکتور</label><select onchange="D.acct=this.value;upd()"><option value="-" ${D.acct=='-'?'selected':''}>نمایش داده نشود</option>${accts().map(a=>`<option value="${a.id}" ${acctOf(D)&&acctOf(D).id==a.id?'selected':''}>${esc(a.label)} ${esc(a.card)}</option>`).join('')}</select></div><div class="card"><div id="sum"></div><button style="width:100%;margin-top:10px" onclick="issue()">صدور فاکتور</button></div>
<div class="tp"><button class="s ${S.tpl==1?'on':''}" onclick="tplPrev(1)">قالب گیاهی سنتی</button><button class="s ${S.tpl==2?'on':''}" onclick="tplPrev(2)">قالب مدرن تیره</button></div>`},
inv(){return`<div class="card">${S.inv.length?[...S.inv].reverse().map((v,k)=>`<div class="li"><div>${F(k+1)}- فاکتور ${F(v.no)} — ${esc(v.cust||'متفرقه')}<small>${v.date} · ${v.pm} · ${listAmt(v)}</small></div><div class="row fit"><button class="s" onclick="view('${v.id}')">نمایش</button><button class="d" onclick="delI('${v.id}')">حذف</button></div></div>`).join(''):'<p>هنوز فاکتوری صادر نشده. از تب «فاکتور جدید» شروع کنید.</p>'}</div>`},
prod(){const p=PE||{name:'',cat:'',unit:'گرم',buy:'',price:'',stock:'',min:''};return`<div class="card"><b>${PE?'ویرایش کالا':'کالای جدید'}</b><label>نام</label><input id="f_name" value="${esc(p.name)}"><div class="g"><div><label>دسته</label><input id="f_cat" value="${esc(p.cat)}"></div><div><label>واحد</label><select id="f_unit">${['گرم','کیلوگرم','لیتر','عدد','واحد','مثقال'].map(u=>`<option value="${u}" ${p.unit==u?'selected':''}>${u}</option>`).join('')}</select></div><div><label>قیمت خرید</label><input id="f_buy" type="number" value="${p.buy}" oninput="wdSet('w_buy',this.value)"><small class="wd" id="w_buy">${wdt(p.buy)}</small></div><div><label>قیمت فروش</label><input id="f_price" type="number" value="${p.price}" oninput="wdSet('w_sell',this.value)"><small class="wd" id="w_sell">${wdt(p.price)}</small></div><div><label>موجودی</label><input id="f_stock" type="number" step="any" value="${p.stock}"></div><div><label>حداقل موجودی</label><input id="f_min" type="number" step="any" value="${p.min}"></div></div><button style="margin-top:12px" onclick="saveP()">ذخیره کالا</button>${PE?' <button class="s" onclick="PE=null;render()">انصراف</button>':''}</div>
<div class="card"><input id="q_p" placeholder="کالا را جستجو کن" value="${esc(PQ)}" oninput="PQ=this.value;$('#plist').innerHTML=pListHTML()" style="margin-bottom:4px"><div id="plist">${pListHTML()}</div></div>`},
