function sendMenu(id){const can=!!navigator.share,a=document.createElement('div');a.id='askb';a.style.cssText='position:fixed;inset:0;background:#000b;z-index:99;overflow:auto;padding:14px';
a.innerHTML=`<div class=card style="max-width:420px;margin:auto"><p><b>ارسال به</b></p>${can?`<button style="width:100%;margin:6px 0;padding:14px" onclick="shareNow('${id}')">📤 منوی اشتراک گوشی (پیشنهادی)</button>`:`<p style="color:#b3402e;font-size:13px">این مرورگر منوی اشتراک گوشی را پشتیبانی نمی‌کند. صفحه را در Chrome از نشانی https باز کنید یا آن را به صفحه اصلی اضافه کنید.</p>`}${APPS.map((x,k)=>`<button class=s style="width:100%;margin:6px 0;padding:10px;display:flex;align-items:center;justify-content:center;gap:10px" onclick="openApp('${id}',${k})"><svg width="28" height="28" viewBox="0 0 32 32">${ICO[k]}</svg>${x[0]}</button>`).join('')}<button class=s style="width:100%;margin-top:6px" onclick="this.closest('#askb').remove()">بستن</button></div>`;document.body.appendChild(a)}
