async function openApp(id,k){const x=APPS[k],o=IMG[id];let f=o&&(o.f||await o.p),ok=false;
try{if(f&&navigator.clipboard&&window.ClipboardItem){await navigator.clipboard.write([new ClipboardItem({'image/png':f})]);ok=true}}catch(e){}
toast(ok?'تصویر فاکتور کپی شد؛ در گفتگو روی «چسباندن» بزنید':'تصویر کپی نشد؛ ابتدا «ذخیره تصویر» را بزنید');
setTimeout(()=>{location.href=/Android/i.test(navigator.userAgent)?'intent://#Intent;'+(x[1]?'package='+x[1]:'scheme='+x[2].split(':')[0])+';S.browser_fallback_url='+encodeURIComponent(x[3])+';end':x[2]},400)}
function copyLink(){const u='https://baserr4-bit.github.io/smart-invoice-maker/';const ok=()=>toast('لینک کپی شد');
function fb(){const t=document.createElement('textarea');t.value=u;t.style.cssText='position:fixed;opacity:0';document.body.appendChild(t);t.select();try{document.execCommand('copy');ok()}catch(e){toast('کپی نشد؛ لینک را نگه دارید و کپی کنید')}t.remove()}
if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(u).then(ok,fb);else fb()}
function shareNow(id){const o=IMG[id],v=S.inv.find(x=>x.id==id);if(!o||!o.f)return toast('در حال آماده سازی فاکتور...');
const na=NA();if(na){b64Of(o.f).then(b=>na.shareFile(b,o.f.name,'image/png',invTxt(v)));return}
navigator.share({files:[o.f],text:invTxt(v)}).catch(e=>{if(!e||e.name!='AbortError')toast('منوی اشتراک باز نشد')})}
